# Velocitab needs a group named like fallback_group ("default") to exist, even with the fallback
# disabled, or it throws "No default tab group defined". This one only covers limbo: players there
# (not logged in yet) see only each other and nobody else sees them.
- name: default
  headers:
  - ''
  footers:
  - ''
  format: '<gray>%username%</gray>'
  nametag:
    prefix: ''
    suffix: ''
  servers:
  - limbo
  sorting_placeholders:
  - '%username_lower%'
  placeholder_replacements: {}
  collisions: false
  header_footer_update_rate: 1000
  format_update_rate: 1000
  nametag_update_rate: 1000
  placeholder_update_rate: 1000
  only_list_players_in_same_server: true
