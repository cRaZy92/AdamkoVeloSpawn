# One group per season so the footer can name the season ("you are on Season 2") while the
# player lines keep the short tag ([S2]). show_all_players_from_all_groups: true in config.yml
# puts everyone from all groups into one network-wide list. Groups are listed in display order.
groups:
- name: s1
  headers:
  - '<newline><gradient:#ffd700:#ff8c00><bold>Country Roads MC</bold></gradient><newline>'
  footers:
  - '<newline><gray>%players_online% online</gray> <dark_gray>·</dark_gray> <gray>you are on</gray> <#55ff55>Season 1</#55ff55> <dark_gray>·</dark_gray> <gray>%ping% ms</gray><newline>'
  format: '<dark_gray>[</dark_gray><#55ff55>S1</#55ff55><dark_gray>]</dark_gray> <white>%prefix%%username%</white>'
  nametag:
    prefix: ''
    suffix: ''
  servers:
  - s1
  sorting_placeholders:
  - '%server_group_index%'
  - '%role_weight%'
  - '%username_lower%'
  placeholder_replacements: {}
  collisions: false
  header_footer_update_rate: 1000
  format_update_rate: 1000
  nametag_update_rate: 1000
  placeholder_update_rate: 1000
  only_list_players_in_same_server: false
- name: s2
  headers:
  - '<newline><gradient:#ffd700:#ff8c00><bold>Country Roads MC</bold></gradient><newline>'
  footers:
  - '<newline><gray>%players_online% online</gray> <dark_gray>·</dark_gray> <gray>you are on</gray> <#55ffff>Season 2</#55ffff> <dark_gray>·</dark_gray> <gray>%ping% ms</gray><newline>'
  format: '<dark_gray>[</dark_gray><#55ffff>S2</#55ffff><dark_gray>]</dark_gray> <white>%prefix%%username%</white>'
  nametag:
    prefix: ''
    suffix: ''
  servers:
