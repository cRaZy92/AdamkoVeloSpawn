name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to create releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # velocity-api 4.x is compiled for Java 25; the plugin itself targets Java 21 (release=21).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: AdamkoVeloSpawn-${{ github.sha }}
          path: |
            build/libs/AdamkoVeloSpawn-*.jar
            companion/build/libs/AdamkoVeloSpawn-Companion-*.jar
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            build/reports/tests/
            companion/build/reports/

      # Every push to main becomes a GitHub release with the jar attached, e.g. v1.0.0-build.12.
      - name: Prepare release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: rel
        run: |
          base=$(sed -n 's/^val baseVersion = "\(.*\)"/\1/p' build.gradle.kts)
          version="${base}.${{ github.run_number }}"
          mkdir -p release
          cp build/libs/AdamkoVeloSpawn-${version}.jar companion/build/libs/AdamkoVeloSpawn-Companion-${version}.jar release/
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        if: steps.rel.outcome == 'success'
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: release/*.jar
